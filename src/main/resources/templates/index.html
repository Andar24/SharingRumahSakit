<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login | CarePulse</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="/style.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: "#004ac6", surface: "#f7f9fb" } } } }
    </script>
</head>
<body class="bg-surface flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary" style="font-family: 'Plus Jakarta Sans', sans-serif;">CarePulse.</h1>
            <p class="text-sm text-gray-500 mt-2">Masuk ke Portal Kesehatan Terpadu</p>
        </div>
        <form id="loginFormAPI" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email</label>
                <input type="email" id="login-email" class="w-full border border-gray-300 p-3 rounded-xl focus:border-primary outline-none" placeholder="Masukkan email terdaftar" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Kata Sandi</label>
                <input type="password" id="login-password" class="w-full border border-gray-300 p-3 rounded-xl focus:border-primary outline-none" placeholder="Masukkan kata sandi" required>
            </div>
            <button type="submit" id="login-btn" class="w-full bg-primary text-white font-bold py-3 rounded-xl hover:bg-primary/90 transition shadow-md">
                Masuk
            </button>
        </form>
    </div>
    
    <script type="module" src="/main.js"></script>
</body>
</html>
