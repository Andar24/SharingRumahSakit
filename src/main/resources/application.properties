# PENGATURAN SERVER
# Menggunakan port dari Railway jika ada, jika tidak gunakan 8080 (untuk lokal)
server.port=${PORT:8080}

# KONFIGURASI POSTGRESQL 
# Mendukung koneksi dari Railway (DATABASE_URL) sekaligus fallback ke localhost
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/carepulse}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE (Otomatis membuat/memperbarui tabel berdasarkan model)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
