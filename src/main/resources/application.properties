# PENGATURAN SERVER
server.port=${PORT:8080}

# KONFIGURASI POSTGRESQL (Support Railway & Lokal)
# WAJIB ada kata "jdbc:" sebelum memanggil variabel DATABASE_URL dari Railway
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/carepulse}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE & JPA CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# THYMELEAF CONFIGURATION
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT CONFIGURATION
# Secret key harus minimal 256-bit untuk HS256 (32 karakter)
jwt.secret=CarePulseSecretKeyForJWTAuthenticationMinimum256BitsRequired2024
# Expiration dalam milliseconds (86400000 = 24 jam)
jwt.expiration=86400000
